<div class="sidebar flex h-full w-full flex-col bg-white">

  <!-- The brand area keeps the sidebar header aligned with the top app chrome. -->
  <div class="flex h-16 shrink-0 items-center gap-2.5 border-b border-gray-200 px-5">
    <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-sky-50 ring-1 ring-sky-100">
      <svg viewBox="0 0 24 24" class="h-6 w-6 text-sky-500" aria-hidden="true">
        <path fill="currentColor"
              transform="translate(12 12) rotate(45) scale(0.85) translate(-12 -12)"
              d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" />
      </svg>
    </span>
    <span class="text-lg font-semibold tracking-tight text-gray-900">Aircraftly</span>
  </div>

  <!-- This is the scrollable navigation area; the rest of the sidebar stays fixed. -->
  <nav aria-label="Main navigation" class="sidebar-scroll flex-1 overflow-y-auto px-3 py-4">

    <div *ngFor="let section of menu; let first = first" [class.mt-6]="!first">

      <!-- Each section groups related screens so the navigation stays easy to scan. -->
      <p class="px-3 pb-1 text-xs font-semibold text-gray-500">
  {{ section.title }}
</p>

      <!-- These links map directly to the route tree for each dashboard or management area. -->
      <ul class="space-y-0.5">
        <li *ngFor="let item of section.items">
          <a [routerLink]="item.route"
             routerLinkActive="!bg-blue-50 !text-blue-700"
             ariaCurrentWhenActive="page"
             class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
            <i class="pi w-5 text-center text-base opacity-75 group-hover:opacity-100"
               [ngClass]="item.icon" aria-hidden="true"></i>
            <span class="truncate">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Footer -->
  <div class="shrink-0 border-t border-gray-200 px-5 py-3 text-xs text-gray-400">
    &copy; 2026 FSTC
  </div>
</div>
