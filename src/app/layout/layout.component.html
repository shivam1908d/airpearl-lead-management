<div class="flex h-[100dvh] overflow-hidden bg-gray-50">

  <!-- Dark backdrop (mobile only): tap to close -->
  <div class="fixed inset-0 z-[55] bg-gray-900/50 transition-opacity duration-300 md:hidden"
       [ngClass]="isSidebarOpen ? 'opacity-100' : 'pointer-events-none opacity-0'"
       (click)="closeSidebar()"
       aria-hidden="true"></div>

  <!-- Sidebar wrapper: full-height drawer on mobile, normal column from md up -->
  <aside
    class="fixed inset-y-0 left-0 z-[60] h-full w-64 max-w-[85vw] shrink-0 overflow-hidden bg-white shadow-xl transition-all duration-300 ease-in-out md:static md:z-auto md:max-w-none md:shadow-none"
    [ngClass]="isSidebarOpen
      ? 'translate-x-0 md:w-56 md:border-r md:border-gray-200'
      : '-translate-x-full md:w-0 md:translate-x-0'"
    [attr.inert]="isSidebarOpen ? null : ''">
    <app-sidebar class="block h-full"></app-sidebar>
  </aside>

  <!-- Right side -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- Header -->
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Page content -->
    <main class="flex-1 overflow-auto bg-gray-50 p-3 sm:p-4 md:p-6">
      <div class="h-full w-full">
        <app-breadcrumb></app-breadcrumb>
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
