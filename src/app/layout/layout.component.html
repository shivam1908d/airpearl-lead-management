<div class="flex h-screen overflow-hidden bg-gray-50">

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-40 flex h-screen overflow-hidden border-r border-gray-200 bg-white shadow-lg transition-all duration-300 md:static md:shadow-none"
    [ngClass]="{
      'translate-x-0': isSidebarOpen,
      '-translate-x-full': !isSidebarOpen,
      'w-64': isSidebarOpen,
      'w-0': !isSidebarOpen,
      'md:w-56': isSidebarOpen,
      'md:w-0': !isSidebarOpen,
      'md:translate-x-0': isSidebarOpen
    }"
  >
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Right side -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- Header -->
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Page content -->
    <main class="flex-1 overflow-auto bg-gray-50 p-3 sm:p-4 md:p-6">
      <div class="h-full w-full">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

</div>
