<!-- top bar: menu button + logo on the left, bell and profile on the right -->
<header class="relative z-50 flex h-16 w-full shrink-0 items-center justify-between border-b border-gray-200 bg-white px-3 sm:px-5">

  <div class="flex min-w-0 items-center gap-2 sm:gap-3">
    <button type="button" (click)="toggle()" aria-label="Toggle menu"
            class="flex h-10 w-10 items-center justify-center rounded-lg text-gray-600 transition hover:bg-gray-100">
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <!-- same logo as the sidebar's phone header, change both if you change one -->
    <div class="flex items-center gap-2.5">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-sky-50 ring-1 ring-sky-100">
        <svg viewBox="0 0 24 24" class="h-6 w-6 text-sky-500" aria-hidden="true">
          <path fill="currentColor"
                transform="translate(12 12) rotate(45) scale(0.85) translate(-12 -12)"
                d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" />
        </svg>
      </span>
      <span class="text-lg font-semibold tracking-tight text-sky-500">AirPearl</span>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-4">
    <button type="button" aria-label="Notifications"
            class="flex h-10 w-10 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 hover:text-gray-700">
      <i class="pi pi-bell text-xl" aria-hidden="true"></i>
    </button>

    <!-- avatar and its dropdown share one wrapper so the menu lines up under the avatar -->
    <div class="relative">
      <button type="button" (click)="toggleProfileMenu()"
              aria-label="Account menu" [attr.aria-expanded]="isProfileOpen"
              class="flex h-9 w-9 items-center justify-center rounded-full bg-purple-700 text-sm font-medium text-white sm:h-10 sm:w-10">
        {{ initials }}
      </button>

      <div *ngIf="isProfileOpen"
           class="absolute right-0 top-full z-50 mt-2 w-52 rounded-lg border border-gray-200 bg-white py-2 shadow-lg">
        <div class="border-b border-gray-100 px-4 pb-2">
          <p class="truncate text-sm font-semibold text-gray-800">{{ userName }}</p>
          <p class="truncate text-xs text-gray-500">{{ userEmail }}</p>
        </div>

        <button type="button" (click)="logout()"
                class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-red-600 hover:bg-gray-50">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>
