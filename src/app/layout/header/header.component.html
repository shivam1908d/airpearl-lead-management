<!-- Header shell with the app title, action buttons, and user profile controls. -->
<header class="relative z-50 flex h-16 w-full items-center justify-between border-b border-gray-200 bg-white px-4 py-3 sm:px-6">
  
  <div class="flex min-w-0 items-center gap-3">
    <button (click)="toggle()" class="mr-2 rounded p-2 transition hover:bg-gray-100">
      <i class="pi pi-bars"></i>
    </button>
    <h1 class="text-lg font-bold tracking-tighter text-gray-800 sm:text-xl">F S T C</h1>
    <div class="mx-2 hidden h-6 w-[1px] bg-gray-300 md:block"></div>
    <span class="hidden border-b-2 border-dotted border-blue-400 pb-1 text-xs text-blue-500 md:block">
      
    </span>
  </div>

  <div class="flex items-center gap-4 sm:gap-6">
    <button class="text-gray-500 transition-colors hover:text-gray-700">
      <i class="pi pi-bell text-xl"></i>
    </button>
    
    <!-- Use the signed-in user state for the avatar so the header reflects the active account. -->
    <div (click)="toggleProfileMenu()" class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full bg-purple-700 text-sm font-medium text-white sm:h-10 sm:w-10">
      {{ initials }}
    </div>

    <div *ngIf="isProfileOpen" class="absolute right-0 top-12 z-50 w-48 rounded-lg border border-gray-200 bg-white py-4 shadow-lg">
      <div class="border-b border-gray-100 px-4 py-2">
        <!-- The profile card reads the logged-in user details instead of hard-coded text. -->
        <p class="truncate text-sm font-semibold text-gray-800">{{ userName }}</p>
        <p class="truncate text-xs text-gray-500">{{ userEmail }}</p>
      </div>

      <button (click)="logout()" class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-red-600 hover:bg-gray-50">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
